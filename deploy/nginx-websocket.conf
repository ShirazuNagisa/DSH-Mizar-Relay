# Paste this inside the reverse-proxy location block for your site.
#
# BaoTa writes a proxy_pass for you when you add a reverse proxy; this is what
# has to sit beside it. The first four lines are the ones that matter, and the
# reason is the same for all of them: a WebSocket starts life as an ordinary
# HTTP request carrying `Upgrade: websocket`, and nginx strips headers it does
# not know to forward. Without them the handshake arrives at the relay as a
# plain GET, and the Mac's tunnel never establishes.

proxy_http_version 1.1;

# Without this pair the Upgrade header is dropped and the handshake fails.
# The symptom is the phone opening a socket and closing it immediately.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";

# The Mac's tunnel is a single long-lived request. nginx closes an idle proxied
# request after 60 seconds by default, which shows up as the tunnel reconnecting
# roughly once a minute, forever. The relay sends a ping every 30 seconds, but a
# read timeout longer than that interval is what actually keeps it open.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Chunked responses must not be buffered: the phone's WebSocket frames have to
# reach it as they arrive, not when a buffer fills.
proxy_buffering off;

# The Mac identifies itself to the relay, not to nginx, but passing these
# through keeps the request honest for anything that logs it.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
