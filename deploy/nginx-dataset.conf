# Anonymous dataset archive receiver (role 0 / 主力0).
#
# Include this inside the server block that already proxies / to the relay, e.g.
#   include /www/wwwroot/dsh-mizar-relay/nginx-dataset.conf;
#
# The daily archive is one streamed body; buffering it in nginx would put the
# whole file in memory before the relay sees a byte, and the default 1m body cap
# would refuse it outright. The 512m cap matches dataset.maxArchiveBytes.
location = /dataset/v1/receive {
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:8787;
}

# /dataset/v1/ingest deliberately stays under the existing 2m location: one
# batch is at most 1 MiB from the desktop, so the default cap is already generous
# and a larger one would only widen what an unauthenticated scanner can send.
