name: ci

# Type-check and the vitest suite on every pull request. The release workflow
# runs the same commands again before publishing, so this job is purely about
# failing early.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
